<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asteroids</title>
<style>
  body{margin:0;background:#0d1117;color:#c9d1d9;
       font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
       display:flex;flex-direction:column;align-items:center;
       justify-content:center;min-height:100vh;gap:.8rem;padding:1rem}
  h1{font-size:1.1rem;color:#3fb950;letter-spacing:.3em;margin:0}
  canvas{border:1px solid #30363d;border-radius:8px;background:#000;
         max-width:100%;touch-action:none;box-shadow:0 0 40px rgba(63,185,80,.15)}
  .hint{font-size:.8rem;color:#8b949e;text-align:center}
  a{color:#58a6ff}
</style>
</head>
<body>
<h1>A S T E R O I D S</h1>
<canvas id="c" width="800" height="600"></canvas>
<p class="hint">← → rotate · ↑ thrust · SPACE fire · P pause &nbsp;|&nbsp; <a href="index.html">← home</a></p>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const keys = {};
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  if (e.key === 'p' || e.key === 'P') paused = !paused;
  if (state !== 'play' && (e.key === ' ' || e.key === 'Enter')) start();
});
addEventListener('keyup', e => keys[e.key] = false);

let ship, rocks, bullets, bits, score, lives, level, state = 'menu', paused = false, invuln = 0;

const wrap = o => {
  if (o.x < 0) o.x += W; if (o.x > W) o.x -= W;
  if (o.y < 0) o.y += H; if (o.y > H) o.y -= H;
};

function newShip() {
  return { x: W/2, y: H/2, a: -Math.PI/2, vx: 0, vy: 0, r: 12, cool: 0 };
}

function newRock(x, y, size) {
  const speed = 0.5 + Math.random() * 1 + level * 0.15;
  const ang = Math.random() * Math.PI * 2;
  const pts = 9 + Math.floor(Math.random() * 4);
  return {
    x, y, size, r: size * 14,
    vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
    a: 0, spin: (Math.random() - 0.5) * 0.03,
    shape: Array.from({length: pts}, () => 0.7 + Math.random() * 0.5)
  };
}

function spawnRocks() {
  rocks = [];
  const n = 3 + level;
  for (let i = 0; i < n; i++) {
    let x, y;
    do { x = Math.random() * W; y = Math.random() * H; }
    while (Math.hypot(x - W/2, y - H/2) < 150);
    rocks.push(newRock(x, y, 3));
  }
}

function boom(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * 3 + 0.5;
    bits.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, color });
  }
}

function start() {
  score = 0; lives = 3; level = 1; state = 'play'; paused = false;
  bullets = []; bits = []; ship = newShip(); invuln = 120;
  spawnRocks();
}

function die() {
  boom(ship.x, ship.y, 25, '#ff7b72');
  lives--;
  if (lives <= 0) { state = 'over'; return; }
  ship = newShip(); invuln = 120;
}

function update() {
  if (state !== 'play' || paused) return;

  // --- ship ---
  if (keys.ArrowLeft)  ship.a -= 0.06;
  if (keys.ArrowRight) ship.a += 0.06;
  if (keys.ArrowUp) {
    ship.vx += Math.cos(ship.a) * 0.12;
    ship.vy += Math.sin(ship.a) * 0.12;
    if (Math.random() < .6)
      bits.push({ x: ship.x - Math.cos(ship.a)*14, y: ship.y - Math.sin(ship.a)*14,
                  vx: -Math.cos(ship.a)*1.5, vy: -Math.sin(ship.a)*1.5, life: .4, color: '#d29922' });
  }
  ship.vx *= 0.99; ship.vy *= 0.99;
  ship.x += ship.vx; ship.y += ship.vy; wrap(ship);
  if (invuln > 0) invuln--;
  if (ship.cool > 0) ship.cool--;

  if (keys[' '] && ship.cool === 0 && bullets.length < 5) {
    bullets.push({ x: ship.x + Math.cos(ship.a)*14, y: ship.y + Math.sin(ship.a)*14,
                   vx: Math.cos(ship.a)*7 + ship.vx, vy: Math.sin(ship.a)*7 + ship.vy, life: 60 });
    ship.cool = 10;
  }

  // --- bullets ---
  bullets = bullets.filter(b => {
    b.x += b.vx; b.y += b.vy; wrap(b);
    return --b.life > 0;
  });

  // --- rocks ---
  rocks.forEach(r => { r.x += r.vx; r.y += r.vy; r.a += r.spin; wrap(r); });

  // --- collisions ---
  for (let i = rocks.length - 1; i >= 0; i--) {
    const r = rocks[i];
    for (let j = bullets.length - 1; j >= 0; j--) {
      if (Math.hypot(r.x - bullets[j].x, r.y - bullets[j].y) < r.r) {
        bullets.splice(j, 1);
        rocks.splice(i, 1);
        score += [0, 100, 50, 20][r.size];
        boom(r.x, r.y, 12, '#8b949e');
        if (r.size > 1) {
          rocks.push(newRock(r.x, r.y, r.size - 1));
          rocks.push(newRock(r.x, r.y, r.size - 1));
        }
        break;
      }
    }
    if (rocks[i] && invuln === 0 && Math.hypot(r.x - ship.x, r.y - ship.y) < r.r + ship.r) {
      die();
      return;
    }
  }

  if (rocks.length === 0) { level++; ship = newShip(); invuln = 90; bullets = []; spawnRocks(); }

  bits = bits.filter(p => {
    p.x += p.vx; p.y += p.vy; p.life -= 0.02;
    return p.life > 0;
  });
}

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 1.5; ctx.lineJoin = 'round';

  if (state === 'play') {
    // rocks
    ctx.strokeStyle = '#8b949e';
    rocks.forEach(r => {
      ctx.beginPath();
      r.shape.forEach((m, i) => {
        const a = r.a + (i / r.shape.length) * Math.PI * 2;
        const x = r.x + Math.cos(a) * r.r * m, y = r.y + Math.sin(a) * r.r * m;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      ctx.closePath(); ctx.stroke();
    });

    // bullets
    ctx.fillStyle = '#58a6ff';
    bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, 7); ctx.fill(); });

    // ship
    if (invuln === 0 || Math.floor(invuln / 6) % 2) {
      ctx.strokeStyle = '#3fb950';
      ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.a);
      ctx.beginPath();
      ctx.moveTo(15, 0); ctx.lineTo(-10, 9); ctx.lineTo(-5, 0); ctx.lineTo(-10, -9);
      ctx.closePath(); ctx.stroke();
      ctx.restore();
    }
  }

  // particles
  bits.forEach(p => {
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 2, 2);
  });
  ctx.globalAlpha = 1;

  // HUD
  ctx.fillStyle = '#c9d1d9'; ctx.font = '16px monospace'; ctx.textAlign = 'left';
  if (state === 'play') {
    ctx.fillText('SCORE ' + score, 16, 28);
    ctx.fillText('LEVEL ' + level, 16, 50);
    ctx.textAlign = 'right';
    ctx.fillText('SHIPS ' + '▲'.repeat(lives), W - 16, 28);
  }

  ctx.textAlign = 'center';
  if (paused && state === 'play') {
    ctx.fillStyle = '#d29922'; ctx.font = '28px monospace';
    ctx.fillText('PAUSED', W/2, H/2);
  }
  if (state === 'menu') {
    ctx.fillStyle = '#3fb950'; ctx.font = '40px monospace';
    ctx.fillText('ASTEROIDS', W/2, H/2 - 20);
    ctx.fillStyle = '#8b949e'; ctx.font = '16px monospace';
    ctx.fillText('press SPACE to start', W/2, H/2 + 20);
  }
  if (state === 'over') {
    ctx.fillStyle = '#ff7b72'; ctx.font = '40px monospace';
    ctx.fillText('GAME OVER', W/2, H/2 - 30);
    ctx.fillStyle = '#c9d1d9'; ctx.font = '20px monospace';
    ctx.fillText('score: ' + score, W/2, H/2 + 5);
    ctx.fillStyle = '#8b949e'; ctx.font = '16px monospace';
    ctx.fillText('press SPACE to play again', W/2, H/2 + 40);
  }
}

(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
